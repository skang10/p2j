name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release_please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-macos:
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build DMG
        working-directory: src-tauri
        run: cargo tauri build --bundles dmg
      - name: Upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" src-tauri/target/release/bundle/dmg/*.dmg --clobber
          cp src-tauri/target/release/bundle/dmg/*.dmg Daybook_aarch64.dmg
          gh release upload "$TAG_NAME" Daybook_aarch64.dmg --clobber
