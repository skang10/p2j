[package]
name = "checkin"
version = "0.3.1"
edition = "2021"
rust-version = "1.77"
description = "Local check-in log"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
