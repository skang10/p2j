<svg width="1120" height="520" viewBox="0 0 1120 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">P to J concept for Daybook</title>
  <desc id="desc">Two friendly illustrated people show the Daybook idea: flexible Prospecting energy becomes structured Judging check-ins.</desc>
  <style>
    .paper {
      fill: #fff7e8;
    }

    .sky {
      fill: #d9f0ef;
    }

    .hill {
      fill: #bfe3ca;
    }

    .ink {
      fill: #25333a;
    }

    .muted {
      fill: #66777c;
    }

    .line {
      stroke: #25333a;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .thin {
      stroke: #25333a;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .soft {
      stroke: #6c7d80;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cream {
      fill: #fffaf0;
    }

    .skin {
      fill: #f1b896;
    }

    .hair {
      fill: #3a2b2f;
    }

    .p-shirt {
      fill: #ef9f54;
    }

    .j-shirt {
      fill: #2f9f9a;
    }

    .green {
      fill: #5abf75;
    }

    .blue {
      fill: #4f86c6;
    }

    .yellow {
      fill: #f4c95d;
    }

    .coral {
      fill: #e86f62;
    }

    .purple {
      fill: #8d76c7;
    }

    .path {
      stroke: #e86f62;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 12 18;
      animation: path 4.5s linear infinite;
    }

    .spark {
      transform-box: fill-box;
      transform-origin: center;
      animation: spark 3.4s ease-in-out infinite;
    }

    .spark:nth-of-type(2) {
      animation-delay: .4s;
    }

    .spark:nth-of-type(3) {
      animation-delay: .9s;
    }

    .spark:nth-of-type(4) {
      animation-delay: 1.3s;
    }

    .check {
      transform-box: fill-box;
      transform-origin: center;
      animation: check 2.8s ease-in-out infinite;
    }

    .dot {
      animation: dot 4.5s ease-in-out infinite;
    }

    @keyframes path {
      to {
        stroke-dashoffset: -60;
      }
    }

    @keyframes spark {
      0%, 100% {
        transform: translateY(0) rotate(-2deg);
      }
      50% {
        transform: translateY(-10px) rotate(4deg);
      }
    }

    @keyframes check {
      0%, 38%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.12);
      }
    }

    @keyframes dot {
      0%, 18% {
        transform: translate(0, 0);
        opacity: 0;
      }
      26% {
        opacity: 1;
      }
      72% {
        transform: translate(250px, -6px);
        opacity: 1;
      }
      88%, 100% {
        transform: translate(250px, -6px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .path,
      .spark,
      .check,
      .dot {
        animation: none;
      }
    }
  </style>

