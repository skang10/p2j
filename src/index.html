<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2J Daybook</title>
<style>
  /* ───────────────────────────────────────────────────────────────────────
     "Figure" — this is a plot of one person's attendance, not a dashboard.
     Two rules generate everything below.

     1. Recorded facts are ink; colour is reserved for claims about the future.
        Every logged fact — calendar cells, pips, bars, share tracks, a chip you
        have tapped — is drawn in one neutral ramp, darker with more activity.
        --accent appears only where the app asserts something that is not yet
        true: the projected segment of a track, the pace sentence, "met". §1 as
        a colour rule, so the palette cannot flatter attendance into progress.

     2. The instrument speaks in mono; you speak in your own voice. Chrome —
        counts, dates, labels, tabs, section heads — is monospace. The titles you
        typed and the sentences the app addresses you in are set in the humanist
        face, so the record is visibly separate from the thing recorded.

     Both themes are the same tokens. Nothing below hardcodes a colour. */
  :root{
    /* light only, by the owner's decision — see §5.2. This also has to say `light`
       rather than `light dark`, or the native select, caret and scrollbar keep
       rendering in dark chrome on a dark-mode machine against a light page. */
    color-scheme:light;
    /* surfaces */
    /* --paper equals --surface on purpose: the window is the page, not a sheet lying on
       a desk. The measure is still capped — a goal's title and its figure 850px apart is
       not a row anyone reads — but the cap is no longer drawn, because the space either
       side of it is the same white. Give --paper its own value to get the desk back. */
    --paper:#FFFFFF; --surface:#FFFFFF; --sunk:#EFF2F6;
    --faint:#F7F9FB; --hair:#EDF0F4; --line:#DFE4EA;
    /* type */
    --ink:#0B1220; --body:#3C4654; --muted:#6B7785; --dust:#98A2B0; --ghost:#C3CAD4;
    /* activity ramp — one hue, five weights: more check-ins, more ink */
    --c0:#E9EDF1; --c1:#B9C2CE; --c2:#7C8A9C; --c3:#465468; --c4:#141C29;
    --on:#FFFFFF;
    /* the one colour: claims, not facts */
    --accent:#0E7C87; --soft:#E4F3F4; --edge:#A8D6DA; --wash:#D2EAEC;
    --alert:#8F5F12; --danger:#B4483F;
    --r:9px; --rs:6px; --gap:5px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--body);font-family:var(--sans);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .sheet{max-width:640px;margin:0 auto;min-height:100%;background:var(--surface);
    padding:26px 30px 48px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  /* top bar */
  .top{display:flex;align-items:baseline;gap:10px;padding-bottom:20px}
  .top h1{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
  .ver{font-size:11.5px;letter-spacing:.02em;color:var(--dust)}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:2px;margin-bottom:14px}
  .nav .m{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;
    letter-spacing:.01em;min-width:124px;text-align:center;color:var(--ink);font-weight:500}
  .nav button{font-size:16.5px;line-height:1;color:var(--muted);background:0;border:0;cursor:pointer;
    width:26px;height:26px;border-radius:var(--rs);transition:background .12s,color .12s}
  .nav button:hover:not(:disabled){color:var(--ink);background:var(--faint)}
  .nav button:disabled{opacity:.25;cursor:default}

  /* a year at one cell per day, same ramp as the calendar below it */
  /* No width cap: the sheet is already capped at 1020px, so a cell can never exceed
     ~15px anyway, and capping again only stopped the grid short of the content's right
     edge while everything below it ran the full width. */
  .heat{--hgap:3px;padding:2px 0 26px}
  .hmons,.hgrid{display:grid;grid-template-columns:repeat(53,minmax(0,1fr));gap:var(--hgap)}
  .hmons i{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.02em;
    color:var(--muted);white-space:nowrap;overflow:visible;padding-bottom:5px}
  .hgrid{grid-auto-flow:column;grid-template-rows:repeat(7,1fr)}
  .hd{aspect-ratio:1;background:var(--c0);border:0;border-radius:2px;padding:0;
    cursor:pointer;transition:background .18s ease,box-shadow .12s ease}
  .hd[data-l="1"]{background:var(--c1)} .hd[data-l="2"]{background:var(--c2)}
  .hd[data-l="3"]{background:var(--c3)} .hd[data-l="4"]{background:var(--c4)}
  .hd.future{background:transparent;box-shadow:inset 0 0 0 1px var(--hair);cursor:default}
  .hd.today{box-shadow:inset 0 0 0 1.5px var(--c3)}
  .hd:not(.future):hover{box-shadow:inset 0 0 0 1.5px var(--ink)}

  /* ── the signature: a month as a strip of presence ──────────────────────
     A day you showed up is a solid block of ink with the date knocked out of
     it. Consecutive days merge into one continuous strip, so a month reads as
     a barcode: long unbroken runs, or scattered ticks. Runs break at the week
     edge because the next day sits on the following row, not beside this one. */
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--gap);margin-bottom:7px}
  .dow i{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:500;
    letter-spacing:.06em;color:var(--dust);text-align:center}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--gap)}
  .d{height:47px;background:var(--c0);border:0;border-radius:var(--r);cursor:pointer;position:relative;
    display:grid;place-items:center;transition:background .18s ease,box-shadow .12s ease}
  .d.cL{border-top-left-radius:0;border-bottom-left-radius:0}
  .d.cR{border-top-right-radius:0;border-bottom-right-radius:0}
  .d.cL::before{content:"";position:absolute;left:calc(var(--gap)*-1);top:0;bottom:0;
    width:calc(var(--gap) + 1px);background-color:inherit}
  .d .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;
    color:var(--muted);transition:color .18s ease}
  .d[data-l="1"]{background:var(--c1)} .d[data-l="2"]{background:var(--c2)}
  .d[data-l="3"]{background:var(--c3)} .d[data-l="4"]{background:var(--c4)}
  .d[data-l="1"] .num{color:var(--ink)}
  .d[data-l="2"] .num,.d[data-l="3"] .num,.d[data-l="4"] .num{color:var(--on)}
  .d.pad{background:transparent;cursor:default}
  .d.future{background:transparent;box-shadow:inset 0 0 0 1px var(--hair);cursor:default}
  .d.future .num{color:var(--ghost)}
  /* today is where you are, so it is the instrument's crosshair, not data */
  .d.today{box-shadow:inset 0 0 0 1.5px var(--c3)}
  .d.sel{box-shadow:inset 0 0 0 2px var(--ink)}
  .d.today.sel{box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 4px var(--soft)}
  .d:not(.pad):not(.future):hover{box-shadow:inset 0 0 0 1.5px var(--ink)}

  /* readouts: the three numbers the month comes down to, set as an instrument
     panel — figure first at size, its label underneath in the chrome face */
  /* Readouts: figure right-aligned in its own column, label in the chrome face beside
     it. The figures are set in --sans, not --mono: SF Mono and Menlo both draw a slashed
     zero, which at this size reads as a symbol rather than a number, and an empty month
     is mostly zeros. `tabular-nums` keeps the column aligned without it. */
  /* Each row is one line box of a FIXED height, and every part of it is inline, so the
     figure, its denominator and its label all sit on that box's single baseline. Nothing
     here is computed from font metrics: the row was previously as tall as whatever the
     26px figure's line box happened to be, which differs between engines, so the rules
     between rows landed on an uneven rhythm in the app while looking right in a test
     browser. --rowh is the whole vertical rhythm of the block. */
  .tally{--rowh:34px;border-bottom:1px solid var(--line);padding:16px 0 18px}
  .tally span{display:block;height:var(--rowh);line-height:var(--rowh);white-space:nowrap}
  .tally b{display:inline-block;font-family:var(--sans);font-variant-numeric:tabular-nums;
    font-weight:500;color:var(--ink);font-size:23px;line-height:1;letter-spacing:-.02em;
    min-width:48px;text-align:right}
  /* A denominator belongs to the figure it divides, so it sits tight against it — but
     outside the fixed-width column, or `0/30` and `0` would not line up on the same edge. */
  .tally i{font-style:normal;font-family:var(--sans);font-variant-numeric:tabular-nums;
    font-weight:400;font-size:13.5px;color:var(--muted);margin-left:1px}
  .tally em{font-style:normal;font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;
    color:var(--muted);margin-left:11px}

  /* three peer views on a rail, current one marked */
  .phead{display:flex;align-items:baseline;gap:12px;margin:26px 0 18px;
    border-bottom:1px solid var(--line)}
  .tabs{display:flex;align-items:baseline;gap:20px}
  .tab{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.01em;color:var(--muted);
    background:0;border:0;padding:0 0 10px;cursor:pointer;position:relative;transition:color .12s}
  .tab:hover{color:var(--body)}
  .tab.on{color:var(--ink)}
  .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
    background:var(--ink)}
  .ctx{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-bottom:10px}
  .lnk{font-size:13.5px;color:var(--muted);cursor:pointer;border:0;background:0;padding:0;
    transition:color .12s}
  .lnk:hover{color:var(--ink)}

  /* goal block */
  .goal{padding:20px 0;border-bottom:1px solid var(--hair);position:relative}
  /* The handle lives in the margin, the way Notion's does, so the titles keep one left
     edge instead of shifting 16px to make room for something usually invisible. Two
     bars drawn from ::before/::after — no icon font (§2.2), no shadow (§5.2). */
  .ghandle{position:absolute;left:-22px;top:22px;width:15px;height:14px;touch-action:none;
    background:0;border:0;padding:0;cursor:grab;opacity:0;transition:opacity .12s}
  .ghandle::before,.ghandle::after{content:"";position:absolute;left:2px;right:2px;
    height:1.5px;border-radius:1px;background:var(--ghost)}
  .ghandle::before{top:4px} .ghandle::after{bottom:4px}
  .goal:hover .ghandle,.ghandle:focus-visible{opacity:1}
  .ghandle:hover::before,.ghandle:hover::after,
  .ghandle:focus-visible::before,.ghandle:focus-visible::after{background:var(--muted)}
  .goal.dragging{opacity:.35}
  /* where it would land, drawn as a rule on the edge it would be inserted at */
  .goal.dropbefore{box-shadow:inset 0 2px 0 -0.5px var(--ink)}
  .goal.dropafter{box-shadow:inset 0 -2px 0 -0.5px var(--ink)}
  .goal:last-of-type{border-bottom:0}
  .ghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .gright{display:flex;align-items:baseline;gap:14px;flex:none}
  .gedit{font-size:13px}
  .goal.ed{background:var(--faint);border-radius:var(--r);border:1px solid var(--line);
    border-bottom:1px solid var(--line);padding:15px 17px 17px;margin:10px 0}
  .goal.ed .cap{padding-top:6px}
  .edfoot{padding-top:14px}
  .frow{display:block;padding:7px 0;cursor:pointer}
  .flbl{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;
    color:var(--muted);padding-bottom:6px}
  .ehead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px}
  .ehead h3{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.04em;color:var(--muted)}
  .ehead .x:hover{color:var(--ink);background:var(--surface)}
  .dzone{padding-top:2px}
  .esep{height:1px;background:var(--line);margin:13px 0 11px}
  .flab{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--muted);padding:0 0 5px}
  .fcount{font-variant-numeric:tabular-nums;opacity:.7}
  i.gone{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.02em;
    color:var(--dust);margin-left:9px}
  .flab.gone{color:var(--dust);padding-top:12px}
  .erow.sub.gone .sname{flex:1;font-size:14px;color:var(--dust)}
  .lnk.dgr{color:var(--danger)}
  .lnk.dgr:hover{color:var(--danger)}
  /* the goal's own name is yours, so it is set in the humanist face */
  .goal h3{font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.011em}
  .prog{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--muted);flex:none}
  .prog b{font-family:var(--sans);font-variant-numeric:tabular-nums;
    color:var(--ink);font-weight:500;font-size:19px;letter-spacing:-.02em}
  .prog i{font-style:normal;font-family:var(--sans);font-variant-numeric:tabular-nums;
    margin-left:1px}
  .prog .hit{color:var(--accent);font-weight:500}

  /* the projection track states the app's whole argument: ink is what you did,
     accent is where this rate lands you, the well is the shortfall */
  .pace{margin:13px 0 0}
  .ptrack{position:relative;height:6px;background:var(--c0);border-radius:3px;overflow:hidden}
  .ptrack i{position:absolute;top:0;bottom:0;display:block;transition:width .25s ease,left .25s ease}
  .ptrack .done{left:0;background:var(--c4);border-radius:3px}
  .ptrack .proj{background:var(--accent)}

  .pips{display:flex;flex-wrap:wrap;gap:4px;margin:13px 0 0}
  .pip{width:11px;height:11px;background:var(--c0);border-radius:3px}
  .pip.f{background:var(--c4)}
  .bar{height:6px;background:var(--c0);border-radius:3px;margin:13px 0 0;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--c4);border-radius:3px}

  /* a chip you have tapped is a recorded fact, so it fills with ink — the same
     language as a filled day on the calendar */
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:13px}
  /* No flex `gap` here: the spacing belongs to the count, so a chip without one
     centres its label rather than reserving room for something that isn't drawn. */
  .chip{font:inherit;font-size:13px;line-height:1.4;padding:7px 11px;border:1px solid transparent;
    background:var(--sunk);color:var(--body);border-radius:var(--r);cursor:pointer;
    transition:border-color .12s,background .12s,color .12s;
    display:inline-flex;align-items:center}
  .chip:hover{border-color:var(--c1);color:var(--ink)}
  .chip.on{background:var(--c4);border-color:var(--c4);color:var(--on);font-weight:500}
  .chip.on:hover{background:var(--c3);border-color:var(--c3)}
  .chip.on .tick{opacity:1}
  .chip .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;
    opacity:.75;margin-left:6px}
  .grp{display:inline-flex}
  .grp .chip{border-radius:var(--r) 0 0 var(--r)}
  .minus{font-size:14px;line-height:1;padding:7px 10px;border:1px solid var(--c4);border-left:0;
    background:var(--c4);color:var(--on);cursor:pointer;border-radius:0 var(--r) var(--r) 0;
    transition:background .12s,border-color .12s}
  .minus:hover{background:var(--c3);border-color:var(--c3)}

  .doneline{margin-top:14px;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;
    gap:5px 12px;align-items:baseline}
  .doneline .lb{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--dust)}
  .doneline .fold{font-size:12px;color:var(--muted);white-space:nowrap}
  .doneline .fold:hover{color:var(--ink)}
  /* A finished item was the palest thing in the block — muted text under a strikethrough
     reads as disabled rather than done. The words carry --body and the rule through them
     recedes instead, so the item stays legible and the line is what says "crossed off".
     Not accent: colour in here means the app is asserting something (§5.2), and a thing
     you finished is simply true — fifty of them in accent would drown the screen. */
  .undone{font:inherit;font-size:13px;background:0;border:0;padding:0;cursor:pointer;color:var(--body);
    text-decoration:line-through;text-decoration-color:var(--line);
    transition:color .12s,text-decoration-color .12s}
  .undone:hover{color:var(--ink);text-decoration-color:var(--muted)}
  .undone em{font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums;
    opacity:.6;margin-left:5px;white-space:nowrap}
  .hint{font-size:14px;color:var(--muted)}

  /* stats */
  .grow{flex:1}
  .sh{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.04em;color:var(--muted);
    margin:30px 0 13px;padding-bottom:10px;border-bottom:1px solid var(--hair)}
  .sh:first-of-type{margin-top:14px}
  /* one row per goal: name, then the amount right-aligned in its own column so the
     figures line up, then what the figure counts */
  /* one archived goal per block: what it came to, when it was last worked, and the two
     things you can do with it */
  .arch{padding:20px 0;border-bottom:1px solid var(--hair)}
  .arch:last-of-type{border-bottom:0}
  .arch h3{font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.011em}
  .acap{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--muted);padding-top:5px}
  .acap b{font-family:var(--sans);font-variant-numeric:tabular-nums;font-weight:500;
    font-size:15px;color:var(--ink)}
  .arow2{display:flex;gap:20px;padding-top:12px}
  .amt{display:flex;flex-direction:column}
  .amtrow{display:flex;align-items:baseline;gap:12px;padding:12px 0;
    border-bottom:1px solid var(--hair);font-size:15px;color:var(--ink)}
  .amtrow:last-child{border-bottom:0}
  .amtrow .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .amtrow .v{font-family:var(--sans);font-variant-numeric:tabular-nums;font-weight:500;
    font-size:21px;line-height:1;letter-spacing:-.02em;color:var(--ink);
    min-width:52px;text-align:right;flex:none}
  .amtrow .u{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--muted);
    min-width:96px;flex:none}
  .ach{display:flex;flex-direction:column}
  .arow{display:flex;align-items:baseline;gap:12px;padding:10px 0;
    border-bottom:1px solid var(--hair);font-size:15px;color:var(--ink)}
  .arow .ad{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:11px;
    color:var(--muted);width:112px;white-space:nowrap;flex:none}
  .arow .at{flex:1}
  .arow .ag{font-family:var(--mono);font-size:11.5px;color:var(--dust);flex:none}
  .arow.hit .at{color:var(--accent);font-weight:500}

  /* editor + footer */
  .foot{padding-top:30px}
  .erow{display:flex;align-items:center;gap:7px;padding:6px 0}
  .erow.sub{padding-left:0}
  input[type=text]{font:inherit;font-size:15px;border:0;border-bottom:1px solid transparent;background:0;
    padding:4px 0;flex:1;min-width:0;color:var(--ink);border-radius:0}
  input[type=text]:hover{border-bottom-color:var(--line)}
  input[type=text]:focus{outline:0;border-bottom-color:var(--accent)}
  /* The OS draws a select as a bordered box with a stepper glyph in it — its own radius,
     its own metrics, its own highlight — so a native one never matches anything around it.
     Take it over and draw the chevron ourselves, from two borders on the wrapper: no icon
     font, and no colour baked into an image where a token could not reach it. */
  select,input[type=number]{font:inherit;font-size:13px;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:5px 6px;flex:none;
    transition:border-color .12s,color .12s,box-shadow .12s}
  select{appearance:none;-webkit-appearance:none;cursor:pointer}
  .fctl{position:relative;display:block}
  .fctl:has(select)::after{content:"";position:absolute;right:15px;top:calc(50% - 6px);
    width:7px;height:7px;pointer-events:none;transform:rotate(45deg);
    border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted)}
  .fctl:has(select):hover::after{border-color:var(--ink)}
  input[type=number]{width:56px;text-align:center;font-variant-numeric:tabular-nums}
  input.etitle{font-size:17.5px;font-weight:600;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-bottom-color:var(--line);border-radius:var(--r);
    padding:10px 12px;width:100%;display:block;transition:border-color .12s}
  input.etitle:hover{border-color:var(--muted)}
  input.etitle:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
  .frow select{width:100%;font-size:14px;color:var(--ink);padding:11px 36px 11px 13px}
  .frow input[type=number]{width:104px;font-size:14px;color:var(--ink);padding:11px 13px;text-align:left;
    font-family:var(--mono)}
  .goal.ed .erow.sub input[type=text]{font-size:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px}
  .goal.ed .erow.sub input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
  .goal.ed .add{padding-left:0}
  select:focus,input:focus{outline:0;border-color:var(--accent);color:var(--ink);
    box-shadow:0 0 0 3px var(--soft)}
  select:hover,input[type=number]:hover{border-color:var(--muted)}
  .x{font:inherit;font-size:17.5px;line-height:1;color:var(--ghost);background:0;border:0;cursor:pointer;
    padding:3px 5px;flex:none;border-radius:var(--rs);transition:color .12s,background .12s}
  .x:hover{color:var(--danger);background:var(--faint)}
  .add{font:inherit;font-size:13.5px;color:var(--muted);background:0;border:0;cursor:pointer;
    padding:5px 0;text-align:left;transition:color .12s}
  .add:hover{color:var(--ink)}
  .addgoal{color:var(--ink);font-weight:500}
  /* the entry point sits at the end of the list it appends to */
  .addrow{padding-top:16px;border-top:1px solid var(--hair)}
  .addrow .cap{padding-top:4px}
  .drop{font:inherit;font-size:13.5px;color:var(--body);background:var(--surface);cursor:pointer;
    border:1px solid var(--line);border-radius:var(--rs);padding:8px 13px;
    transition:color .12s,border-color .12s}
  .drop:hover{color:var(--danger);border-color:var(--danger)}
  .btn{font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;border-radius:var(--rs);
    padding:9px 19px;border:1px solid transparent;transition:background .12s,border-color .12s}
  .btn.pri{background:var(--c4);color:var(--on);border-color:var(--c4)}
  .btn.pri:hover{background:var(--c3);border-color:var(--c3)}
  .btn:focus-visible{outline:0;box-shadow:0 0 0 3px var(--soft)}
  .cap{font-size:13px;color:var(--muted);padding-top:10px;line-height:1.65}

  /* Desktop: the record on the left, the day's work on the right, divided by a

  @media (min-width:820px){

  /* ── Daybook application shell ───────────────────────────────────────── */
  :root{
    --paper:#F4F5F7;--surface:#FFFFFF;--sunk:#F1F2F4;--faint:#F8F9FA;
    --hair:#E8EAED;--line:#DADDE2;--ink:#17191C;--body:#42464D;
    --muted:#747981;--dust:#9DA2AA;--ghost:#C9CDD3;
    --c0:#ECEEF1;--c1:#C8D9D4;--c2:#8AB5A7;--c3:#43816F;--c4:#165343;
    --accent:#176B57;--soft:#E4F2ED;--edge:#A8D1C4;--wash:#D3E8E1;
    --alert:#9A650F;--danger:#C33D36;--r:8px;--rs:6px;
  }
  body{background:var(--paper);font-size:14px;line-height:1.5;overflow-x:hidden}
  button,input,select{letter-spacing:0}
  select,select option{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC",sans-serif}
  .sheet{max-width:none;min-height:100%;margin:0;padding:0;background:var(--paper)}
  .appframe{display:grid;grid-template-columns:294px minmax(0,1fr);min-height:100vh}

  .sidebar{position:sticky;top:0;height:100vh;padding:28px 22px 24px;background:rgba(247,248,249,.94);
    border-right:1px solid rgba(23,25,28,.09);backdrop-filter:blur(24px);overflow:auto}
  .top{display:flex;align-items:center;gap:11px;padding:0 2px 28px}
  .brandmark{display:block;width:36px;height:36px;flex:none;border-radius:9px;object-fit:cover;
    box-shadow:0 4px 12px rgba(23,25,28,.13)}
  .top h1{font-family:var(--sans);font-size:17px;line-height:1.2;font-weight:700;letter-spacing:0;color:var(--ink)}
  .top p{margin-top:2px;font-size:11px;line-height:1.25;color:var(--muted)}
  .top .ver{margin-left:auto;align-self:center;padding:0;background:transparent;color:var(--muted);
    font-family:var(--sans);font-size:10px;font-weight:500}

  .phead{display:block;margin:0 0 30px;border:0}
  .tabs{display:flex;flex-direction:column;gap:3px;padding:0;background:transparent;border-radius:0}
  .tab{width:100%;min-width:0;padding:9px 12px;border-radius:7px;text-align:left;font-family:var(--sans);
    font-size:13px;font-weight:550;color:var(--muted)}
  .tab::before{display:inline-block;width:22px;font-size:15px;line-height:1;vertical-align:-1px;color:currentColor}
  .tab[data-tab="day"]::before{content:"●"}.tab[data-tab="stats"]::before{content:"◫"}
  .tab[data-tab="archive"]::before{content:"▱"}
  .tab:hover{background:rgba(23,25,28,.045);color:var(--ink)}
  .tab.on{background:var(--soft);color:var(--accent);box-shadow:none}
  .tab.on::after{content:none}
  .ctx{display:block;padding:9px 12px 0;font-family:var(--sans);font-size:11px;white-space:normal}

  .calcol{padding:0;background:transparent;border:0}
  .nav{display:grid;grid-template-columns:27px minmax(0,1fr) 27px;align-items:center;margin:0 0 12px;padding:0 3px}
  .nav .m{font-family:var(--sans);font-size:13px;font-weight:650;letter-spacing:0;text-align:center}
  .nav button{width:27px;height:27px;margin:0;border:1px solid var(--hair);border-radius:6px;
    background:var(--surface);font-size:16px;color:var(--body)}
  .nav button:hover:not(:disabled){background:var(--soft);border-color:var(--edge);color:var(--accent)}
  .dow{gap:3px;margin-bottom:4px}.dow i{font-family:var(--sans);font-size:9px;letter-spacing:0}
  .cal{gap:3px}
  .d{height:31px;border-radius:6px;background:transparent}
  .d .num{font-family:var(--sans);font-size:11px;color:var(--body)}
  .d[data-l="1"],.d[data-l="2"],.d[data-l="3"],.d[data-l="4"]{border-radius:6px}
  .d.cL,.d.cR{border-radius:6px}.d.cL::before{display:none}
  .d.future{box-shadow:none}.d.future .num{color:var(--ghost)}
  .d.today{box-shadow:inset 0 0 0 1px var(--accent)}
  .d.sel,.d.today.sel{background:var(--accent);box-shadow:none}
  .d.sel .num,.d.today.sel .num{color:#fff;font-weight:650}
  .tally{display:grid;grid-template-columns:1fr 1fr;margin-top:18px;padding:16px 0 0;
    border-top:1px solid var(--hair);border-bottom:0}
  .tally>*{display:flex;flex-direction:column;align-items:center;height:auto;line-height:1;text-align:center}
  .tally>*+*{border-left:1px solid var(--hair)}
  .tally b{min-width:0;font-family:var(--sans);font-size:22px;font-weight:650;text-align:center;color:var(--accent)}
  .tally em{margin:7px 0 0;font-family:var(--sans);font-size:10px;font-style:normal;color:var(--muted)}
  .tallyitem{border:0;background:transparent;cursor:pointer}
  .tallyitem.static{cursor:default}
  .tallyitem:hover b{color:#115544}.tallyitem:hover em{color:var(--body)}

  .workspace{min-width:0;padding:54px clamp(32px,5vw,76px) 64px}
  .workhead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;max-width:920px;margin:0 auto 30px}
  .eyebrow{margin-bottom:5px;font-size:12px;font-weight:650;color:var(--accent)}
  .workhead h2{font-size:28px;line-height:1.15;font-weight:710;letter-spacing:0;color:var(--ink)}
  .daystatus{display:flex;align-items:center;gap:18px;flex:none;color:var(--muted)}
  .daymetric{display:flex;align-items:baseline;gap:5px}
  .daystatus b{font-size:22px;line-height:1;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
  .daymetric>span{font-size:10px}
  .monthswitch{display:grid;grid-template-columns:30px minmax(120px,auto) 30px;align-items:center;gap:5px}
  .monthswitch span{text-align:center;font-size:12px;font-weight:600;color:var(--body)}
  .monthswitch button{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface);
    color:var(--body);font-size:17px;cursor:pointer}
  .monthswitch button:hover:not(:disabled){border-color:var(--edge);background:var(--soft);color:var(--accent)}
  .monthswitch button:disabled{opacity:.35;cursor:default}
  .panel{max-width:920px;margin:0 auto;padding:0;background:transparent}

  .goal{margin:0 0 10px;padding:20px 20px 19px;background:var(--surface);border:1px solid var(--hair)!important;
    border-radius:8px;box-shadow:0 1px 2px rgba(23,25,28,.025);transition:border-color .16s,box-shadow .16s}
  .goal:hover{border-color:#D6D9DD!important;box-shadow:0 6px 18px rgba(23,25,28,.055)}
  .goal h3{font-size:16px;font-weight:670;letter-spacing:0}
  .ghead{align-items:center}.gright{align-items:center;gap:12px}
  .ghandle{left:-25px;top:25px}.gedit{opacity:0;font-size:12px}
  .goal:hover .gedit,.gedit:focus-visible{opacity:1}
  .prog{font-family:var(--sans);font-size:11px;line-height:1.2;letter-spacing:0;color:var(--muted)}
  .prog b{font-size:16px;font-weight:650}
  .prog i{margin-left:4px;margin-right:7px;color:var(--dust)}
  .pace,.pips,.bar{margin-top:13px}.ptrack,.bar{height:5px;background:var(--sunk)}
  .ptrack .done,.bar i{background:var(--accent)}.ptrack .proj{background:var(--edge)}
  .pips{gap:3px}.pip{width:7px;height:7px;border-radius:2px}.pip.f{background:var(--accent)}
  .chips{gap:7px;margin-top:16px}
  .chip{min-height:32px;padding:6px 11px;border:1px solid var(--hair);border-radius:7px;
    background:var(--faint);font-size:12px;color:var(--body)}
  .chip:hover{background:var(--soft);border-color:var(--edge);color:var(--accent)}
  .chip.on,.minus{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.on:hover,.minus:hover{background:#115544;border-color:#115544}
  .grp .chip{border-radius:7px 0 0 7px}.minus{border-radius:0 7px 7px 0}
  .doneline{margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);font-size:12px}
  .addrow{margin-top:12px;padding:0;border:0}
  .addgoal{display:flex;align-items:center;gap:10px;width:100%;height:46px;padding:0 15px;
    border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);
    font-size:13px;font-weight:600;text-align:left;transition:background .16s,border-color .16s,color .16s}
  .addgoal span{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;
    background:var(--soft);color:var(--accent);font-size:17px;font-weight:450;line-height:1}
  .addgoal:hover{background:var(--surface);border-color:var(--hair);color:var(--accent)}
  .addgoal:hover span{background:var(--accent);color:#fff}
  .snapshotnote{display:inline-flex;align-items:center;min-height:28px;margin-bottom:14px;padding:5px 10px;
    border-radius:6px;background:var(--sunk);font-size:10px;font-weight:600;color:var(--muted)}
  .goal.snapshot{box-shadow:none}.goal.snapshot:hover{border-color:var(--hair)!important;box-shadow:none}

<script>
const KEY='checkin-v3', DOW=['S','M','T','W','T','F','S'], MAXGOALS=5;
const MON=['January','February','March','April','May','June',
           'July','August','September','October','November','December'];
const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ETAMIN=5;   // days that must have elapsed before a rate is worth projecting (§8.1)
const DONEMAX=5;  // finished list items shown before the rest fold away (§5)
const PAGE_SIZE=5;
let state={goals:[],logs:{}};
let view=null, sel=null, panel='day', editing=null, draftGoal=null, draftIsNew=false, saveErr=false;
const sectionOpen={records:true,days:true,mix:true,completed:true};
const sectionPage={records:0,days:0,mix:0,completed:0,archive:0};
let notice='';
let purging=null;                  // the archived goal awaiting a permanent delete
let dragId=null;                   // the goal being dragged, while it is in the air
let version='';                    // read from the bundle at startup, blank in a browser
const doneOpen=new Set();          // list goals whose finished items are unfolded
const archiveOpen=new Set();       // archived goals whose preserved details are visible

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const todayKey=()=>key(today());
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const label=k=>{const d=parseKey(k);return MONS[d.getMonth()]+' '+d.getDate()};
const short=k=>{const d=parseKey(k);return `${MON[d.getMonth()]} ${d.getDate()} ${d.getFullYear()}`};
const mKey=(y,m)=>y+'-'+pad(m+1);
const inMonth=(k,y,m)=>k.startsWith(mKey(y,m));
const inLastMonth=k=>{const end=today(),start=new Date(end);start.setMonth(start.getMonth()-1);
  const d=parseKey(k);return d>=start&&d<=end};
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const diffDays=(a,b)=>Math.round((b-a)/864e5);
const newId=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- storage layer: swap the backend here and nowhere else ---------- */
const Store = (() => {
  const T = window.__TAURI__;
  if (T) {                                    // desktop (Tauri): a JSON file on disk
    const invoke = T.core.invoke;
    return { kind:'tauri',
      read:  ()  => invoke('load_data'),
      write: (s) => invoke('save_data', { data: s }) };
  }
  return { kind:'browser',                    // browser fallback (§7.1): localStorage
    read:  async ()  => localStorage.getItem(KEY) || '',
    write: async (s) => { localStorage.setItem(KEY, s); } };
})();

/* ---------- load / save ---------- */
// The version is asked of the running bundle rather than written down here. A third copy
// beside tauri.conf.json and Cargo.toml would go stale silently, and a version display
// that has drifted from the build is worse than no version display at all.
async function readVersion(){
  try{ const T=window.__TAURI__; if(T&&T.app) version=await T.app.getVersion(); }
  catch(e){ version=''; }
}

async function load(){
  let explicitMock=false;
  try{
    const raw = await Store.read();
    if(raw && raw.trim() && raw.trim()!=='{}'){
      state = JSON.parse(raw);
      explicitMock=Boolean(state._mockScenario);
    }
  }catch(e){ console.warn('Read failed, starting fresh', e); }
  if(!state.goals||(!state.goals.length&&!explicitMock)) state=seed();
  if(!state.logs) state.logs={};
  state.goals.forEach(g=>{ if(!g.type)g.type='daily'; if(!g.subs)g.subs=[];
    delete g.cad; });   // cadence is gone; drop the dead field on the way through
  const n=today(); view={y:n.getFullYear(),m:n.getMonth()}; sel=todayKey();
  await readVersion();
  render();
}
let timer=null;
function save(){
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    try{ await Store.write(JSON.stringify(state,null,1)); saveErr=false; }
    catch(e){ console.error('Save failed',e); saveErr=true; render(); }
  },250);
}
function seed(){
  return {logs:{},goals:[
    {id:newId(),type:'count',target:40,title:'Problems',subs:[
      {id:newId(),title:'Arrays / strings'},{id:newId(),title:'Lists / trees'},
      {id:newId(),title:'DP'},{id:newId(),title:'Other'}]},
    {id:newId(),type:'list',title:'To learn',subs:[
      {id:newId(),title:'Rolling IC'},{id:newId(),title:'Block bootstrap'},
      {id:newId(),title:'PSI / CSI'},{id:newId(),title:'Kalman filter'}]},
    {id:newId(),type:'daily',title:'Job hunt',subs:[
      {id:newId(),title:'Applications'},{id:newId(),title:'Resume'},{id:newId(),title:'Interview prep'}]}
  ]};
}

/* ---------- derived ---------- */
const dayTotal=k=>Object.values(state.logs[k]||{}).reduce((a,b)=>a+b,0);
const level=n=>n===0?0:n===1?1:n===2?2:n<=4?3:4;
// Every date with any activity, sorted. Kept as the single entry point for
// "which days count", so a second source of activity can be added back in one place.
const dayKeys=()=>Object.keys(state.logs).sort();
function subTotal(id,y,m){
  let n=0;
  for(const k in state.logs){ if(y!==undefined&&!inMonth(k,y,m))continue; n+=state.logs[k][id]||0; }
  return n;
}
function firstDone(){
  const m={};
  Object.keys(state.logs).sort().forEach(d=>Object.keys(state.logs[d]).forEach(s=>{if(!m[s])m[s]=d;}));
  return m;
}
function activeDays(y,m){
  let n=0; for(const k of dayKeys()) if(inMonth(k,y,m)&&dayTotal(k)>0) n++;
  return n;
}
function goalDays(g,y,m){
  let n=0;
  for(const k in state.logs) if(inMonth(k,y,m)&&g.subs.some(s=>state.logs[k][s.id])) n++;
  return n;
}
const goalCount=(g,y,m)=>g.subs.reduce((a,s)=>a+subTotal(s.id,y,m),0);
// Length of the current run of consecutive active days. If today has nothing logged
// yet the run is measured to yesterday, so it does not read 0 every morning before
// you have had a chance to check in.
function streak(){
  const d=today();
  if(dayTotal(key(d))===0) d.setDate(d.getDate()-1);
  let n=0;
  while(dayTotal(key(d))>0){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---------- archive, not erase (§4.5) ---------- */
// Removing a goal means "stop tracking this", not "this never happened". The days it
// was checked in on are facts about those days: the calendar, the streak and every
// past month were computed from them, and silently dropping the entries would rewrite
// a record that was true when it was made. So a goal that has ever been logged is
// archived — it leaves the check-in screen and stops counting against MAXGOALS, but
// its logs stay and past months still report it. A goal with no logs has nothing to
// preserve, so it is simply removed. Same rule one level down, for sub-goals.
const live=()=>state.goals.filter(g=>!g.archived);
const liveSubs=g=>g.subs.filter(s=>!s.archived);
const subLogged=id=>{ for(const k in state.logs) if(state.logs[k][id]) return true; return false; };
const goalLogged=g=>g.subs.some(s=>subLogged(s.id));

function dropGoal(id){
  const i=state.goals.findIndex(g=>g.id===id); if(i<0) return;
  const g=state.goals[i];
  if(goalLogged(g)) g.archived=true;
  else state.goals.splice(i,1);
  if(editing===id){editing=null;draftGoal=null;draftIsNew=false;}
  notice=''; purging=null; save(); render();
}
function dropSub(id){
  for(const g of state.goals){
    const i=g.subs.findIndex(s=>s.id===id); if(i<0) continue;
    if(subLogged(id)) g.subs[i].archived=true; else g.subs.splice(i,1);
    break;
  }
  save(); editing?refreshEditor():render();
}
function restoreGoal(id){
  const g=state.goals.find(x=>x.id===id); if(!g) return;
  if(live().length>=MAXGOALS){
    notice=`You already have ${MAXGOALS} goals. Remove one before restoring another.`;
    render(); return;
  }
  delete g.archived; notice=''; purging=null; save(); render();
}
function restoreSub(id){
  for(const g of state.goals){ const s=g.subs.find(s=>s.id===id); if(s){ delete s.archived; break; } }
  save(); editing?refreshEditor():render();
}
// The only path that removes logs. It exists so archiving is not a one-way street:
// a goal you are certain about can still be erased, and it says how much it will cost.
function purgeGoal(id){
  const i=state.goals.findIndex(g=>g.id===id); if(i<0) return;
  const g=state.goals[i];
  g.subs.forEach(s=>stripSub(s.id));
  state.goals.splice(i,1);
  purging=null;
  notice=`Deleted “${g.title}” and its check-ins.`;
  save(); render();
}

/* ---------- order ---------- */
// state.goals is the render order, so reordering is a splice and persistence is free.
// The screen shows live() — archived goals sit in the array but not on screen — so a
// move is always expressed as "put this one before that one" and resolved against the
// full array. Using a screen index would silently jump an archived goal.
function moveGoal(id,beforeId){
  const from=state.goals.findIndex(g=>g.id===id);
  if(from<0||id===beforeId) return;
  const [g]=state.goals.splice(from,1);
  const to=beforeId==null?-1:state.goals.findIndex(x=>x.id===beforeId);
  state.goals.splice(to<0?state.goals.length:to,0,g);
  save(); render();
}
// Dragging is not the only way to do this: with the handle focused, the arrow keys move
// a goal one place. `after` is the goal it should follow, so moving down means landing
// before whatever came after that.
function nudgeGoal(id,dir){
  const vis=live(), i=vis.findIndex(g=>g.id===id), j=i+dir;
  if(i<0||j<0||j>=vis.length) return;
  moveGoal(id, dir<0 ? vis[j].id : (vis[j+1]?vis[j+1].id:null));
  const h=document.querySelector(`[data-grip="${id}"]`); if(h) h.focus();
}

// The drag itself. Nothing is committed until the mouse is released, so letting go
// away from any goal is a cancel.
function beginDrag(id){
  const rows=()=>[...document.querySelectorAll('[data-goal]')];
  const src=rows().find(r=>r.dataset.goal===id);
  if(!src) return;
  dragId=id; src.classList.add('dragging');
  let over=null, before=true;
  const clear=()=>rows().forEach(r=>r.classList.remove('dropbefore','dropafter'));
  document.onmousemove=e=>{
    clear(); over=null;
    for(const r of rows()){
      const b=r.getBoundingClientRect();
      if(e.clientY<b.top||e.clientY>b.bottom) continue;
      if(r.dataset.goal===id) break;                 // over itself: nowhere to land
      over=r.dataset.goal; before=e.clientY<b.top+b.height/2;
      r.classList.add(before?'dropbefore':'dropafter');
      break;
    }
  };
  document.onmouseup=()=>{
    document.onmousemove=null; document.onmouseup=null;
    clear(); src.classList.remove('dragging'); dragId=null;
    if(!over) return;
    // dropping below a goal means landing before whatever follows it — or last
    const vis=live(), i=vis.findIndex(g=>g.id===over);
    moveGoal(id, before?over:(vis[i+1]?vis[i+1].id:null));
  };
}

/* ---------- check-in ---------- */
function bump(id,delta){
  const k=sel||todayKey(), day=state.logs[k]||{}, v=(day[id]||0)+delta;
  if(v>0) day[id]=v; else delete day[id];
  if(Object.keys(day).length) state.logs[k]=day; else delete state.logs[k];
  save(); render();
}
// Take one sub-goal out of every day it appears in. The only way logs are destroyed,
// shared by the "undone" control and by a permanent delete (§4.5).
function stripSub(id){
  Object.keys(state.logs).forEach(d=>{ delete state.logs[d][id];
    if(!Object.keys(state.logs[d]).length) delete state.logs[d]; });
}
function clearSub(id){ stripSub(id); save(); render(); }

/* ---------- render ---------- */
function render(quietEditor=false){
  const n=today(), tk=todayKey();
  const isCur = view.y===n.getFullYear() && view.m===n.getMonth();
  const canNext = view.y<n.getFullYear() || (view.y===n.getFullYear()&&view.m<n.getMonth());
  const run=streak();
  const records=dayKeys().reduce((sum,k)=>sum+dayTotal(k),0);

  document.getElementById('app').innerHTML=`
    <div class="appframe">
      <aside class="sidebar">
        <div class="top">
          <img class="brandmark" src="daybook-icon.png" alt="">
          <div><h1>P2J Daybook</h1></div>
          ${version?`<span class="ver mono">${esc(version)}</span>`:''}
        </div>
        ${tabs()}
        <div class="calcol">
        <div class="nav">
          <button id="prev" aria-label="Previous month">‹</button>
          <span class="m">${MON[view.m]} ${view.y}</span>
          <button id="next" ${canNext?'':'disabled'} aria-label="Next month">›</button>
        </div>
        <div class="dow">${DOW.map(d=>`<i>${d}</i>`).join('')}</div>
        <div class="cal">${calendar(tk)}</div>
        <div class="tally">
          <div class="tallyitem static"><b>${run}</b><em>Day Streak</em></div>
          <button class="tallyitem" id="recordsJump" title="View activity history"><b>${records}</b><em>Total Records</em></button>
        </div>
        </div>
      </aside>
      <main class="workspace">
        <header class="workhead">
          <div>
            <p class="eyebrow">${panel==='day' ? (sel===tk?'Today':'Past day') : panel==='stats' ? `${MON[view.m]} review` : 'Past goals'}</p>
            <h2>${panel==='day' ? (sel===tk?'What will you show up for?':esc(label(sel||tk))) : panel==='stats' ? 'Your month at a glance' : 'Archive'}</h2>
          </div>
          ${panel==='day'?`<div class="daystatus">
            <span class="daymetric"><b>${dayTotal(sel||tk)}</b><span>record${dayTotal(sel||tk)===1?'':'s'}</span></span>
          </div>`:
            panel==='stats'?`<div class="monthswitch" aria-label="Stats month">
              <button data-sm="-1" aria-label="Previous stats month">‹</button>
              <span>${MON[view.m]} ${view.y}</span>
              <button data-sm="1" ${canNext?'':'disabled'} aria-label="Next stats month">›</button>
            </div>`:''}
        </header>
        <div class="panel">
          ${panel==='stats' ? statsPanel() : panel==='archive' ? archivePanel() : dayPanel(sel||tk,tk,quietEditor)}
        </div>
        ${panel==='day'?`<section class="history" aria-label="Activity history">
          <div class="historyhead"><h2>Consistency</h2><span>Last 12 months</span></div>
          ${heatmap()}
        </section>`:''}
      </main>
    </div>

    ${foot()}`;
  bind();
}

// The footer is down to one thing, and it is the one thing that must never be missed.
// It is still conditional, so the container is too: an empty one drew its top rule and
// padding as a line across the page under no content.
function foot(){
  const bits = [
    saveErr?'<p class="store"><span class="bad">Write failed. Changes were not saved.</span></p>':'',
  ].join('');
  return bits ? `<div class="foot">${bits}</div>` : '';
}
// Everything that has left the check-in screen but not the file. It gets a tab rather
// than a line in the footer: one goal made that line read as a sentence rather than as
// controls (`To learn Restore Delete permanently`), and a second would have made it worse.
// Erasing a goal's logs is the one act here that cannot be undone, so it asks, and the
// question names the cost.
const lastWorked=g=>{ let best=null;
  for(const k in state.logs) if(g.subs.some(s=>state.logs[k][s.id])) if(!best||k>best) best=k;
  return best; };

function archivePanel(){
  const gone=state.goals.filter(g=>g.archived);
  const archivePage=pageOf(gone,'archive');
  const rows=archivePage.items.map(g=>{
    if(purging===g.id){
      const n=goalCount(g);
      return `<div class="arch"><h3>${esc(g.title)}</h3>
        <p class="warnrow">Delete this goal and its ${n} record${n===1?'':'s'} permanently?
          <button class="lnk dgr" data-purge="${g.id}">Delete</button>
          <button class="lnk" id="nopurge">Cancel</button></p></div>`;
    }
    const {v,u}=goalAmount(g), unit=g.type==='count'?`record${v===1?'':'s'}`:u;
    const last=lastWorked(g), open=archiveOpen.has(g.id);
    const details=g.subs.map(s=>`<div class="archsub"><span>${esc(s.title)}</span>
      <b>${subTotal(s.id)}</b><em>record${subTotal(s.id)===1?'':'s'}</em></div>`).join('');
    return `<div class="arch" data-archive-goal="${g.id}">
      <button class="archtoggle" data-ao="${g.id}" aria-expanded="${open}">
        <h3>${esc(g.title)}</h3><span aria-hidden="true">›</span></button>
      <p class="acap"><b>${v}</b> ${unit}${last?` · last worked ${short(last)}`:''}</p>
      ${open?`<div class="archdetail">${details||'<p class="hint">No sub-goals.</p>'}</div>`:''}
      <div class="arow2">
        <button class="lnk" data-rg="${g.id}">Restore</button>
        <button class="lnk dgr" data-pg="${g.id}">Delete permanently</button></div></div>`;
  }).join('');
  return `
    ${notice?`<p class="notice">${esc(notice)}</p>`:''}
    ${rows||`<p class="hint" style="padding:10px 0">Nothing archived. Removing a goal that has
      records puts it here, with its history intact.</p>`}
    ${pager(archivePage,'archive')}`;
}

// A year of days at one cell each, in the same ramp as the calendar — the same
// instrument at a wider zoom, not a borrowed component. Columns are weeks, rows are
// weekdays, and the last column holds today. Clicking a day takes the calendar to it,
// which is the only jump between months left since the year strip and the stats chart
// went; ‹ › alone made a month six back a six-click trip.
const HWEEKS=53;
function heatStart(){
  const n=today(), d=new Date(n);
  d.setDate(d.getDate() - (HWEEKS-1)*7 - n.getDay());   // back to the Sunday of the first week
  return d;
}
function heatmap(){
  const start=heatStart(), n=today(), tk=todayKey();
  let cells='', mons='', shown=-1, shownY=-1, lastAt=-9, lastWide=false;
  for(let w=0;w<HWEEKS;w++){
    // A month is labelled at the first week that begins inside it. Labelling by the
    // week's last day put the name a column early: the week of Jul 26 ends on Aug 1 and
    // was headed "Aug" while six of its seven days were July.
    const wk=new Date(start); wk.setDate(start.getDate()+w*7);
    const m=wk.getMonth();
    // A 53-week window opens partway through a month, so its first label can land a
    // column before the next one and the two collide. Drop a label rather than crowd
    // it — the month is still findable from the ones either side.
    // the year is named where it changes, and on the first label, so the window is
    // never ambiguous about which July it opened in
    const y=wk.getFullYear(), withYear = y!==shownY;
    // a label needs clear columns after the previous one or the two run together; one
    // carrying a year is nearly twice as wide, so it claims more
    const show = m!==shown && w-lastAt>=(lastWide?6:3);
    if(m!==shown) shown=m;
    if(show){ lastAt=w; lastWide=withYear; shownY=y; }
    mons+=`<i${show&&w>HWEEKS-4?' class="edge"':''}>${show?MONS[m]+(withYear?' '+y:''):''}</i>`;
  }
  for(let i=0;i<HWEEKS*7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const k=key(d);
    if(d>n){ cells+='<span class="hd future"></span>'; continue; }
    const t=dayTotal(k);
    cells+=`<button class="hd${k===tk?' today':''}" data-l="${level(t)}" data-hk="${k}"
      title="${label(k)} · ${t} record${t===1?'':'s'}"></button>`;
  }
  return `<div class="heat">
    <div class="hmons">${mons}</div>
    <div class="hgrid">${cells}</div>
  </div>`;
}

function calendar(tk){
  const {y,m}=view, dim=daysIn(y,m), lead=new Date(y,m,1).getDay(), tdy=today();
  const on=i=>i>=1&&i<=dim&&dayTotal(key(new Date(y,m,i)))>0;
  let h='';
  for(let i=0;i<lead;i++) h+='<div class="d pad"></div>';
  for(let i=1;i<=dim;i++){
    const d=new Date(y,m,i), k=key(d);
    if(d>tdy){ h+=`<div class="d future"><span class="num">${i}</span></div>`; continue; }
    const cls=['d']; if(k===tk)cls.push('today'); if(k===sel&&panel==='day')cls.push('sel');
    // join a run of consecutive days into one bar; runs break at the week edge
    // because the next day is on the following row, not beside this one
    if(on(i)){
      const dow=d.getDay();
      if(dow!==0 && on(i-1)) cls.push('cL');
      if(dow!==6 && on(i+1)) cls.push('cR');
    }
    h+=`<button class="${cls.join(' ')}" data-l="${level(dayTotal(k))}" data-k="${k}"
        title="${label(k)} · ${dayTotal(k)} check-in${dayTotal(k)===1?'':'s'}"><span class="num">${i}</span></button>`;
  }
  return h;
}
// The three views are peers, so they get one persistent switcher rather than a
// heading plus two links that change shape depending on where you already are.
function tabs(){
  const n=today(), tk=todayKey();
  const isCur = view.y===n.getFullYear() && view.m===n.getMonth();
  const home = panel==='day' && sel===tk && isCur;
  const showDate = panel==='day' && sel && sel!==tk;
  // the middle tab names the month it will actually show, so it never reads
  // "This month" while displaying June
  const views=[['day','Today'],['stats','Stats'],['archive','Archive']];
  return `<div class="phead">
      <nav class="tabs">${views.map(([p,name])=>
        `<button class="tab${panel===p?' on':''}" data-tab="${p}"${
          panel===p?' aria-current="page"':''}>${name}</button>`).join('')}</nav>
      <span class="grow"></span>
      ${panel==='day'&&!home?`<span class="ctx">${showDate?esc(label(sel))+' · ':''}<button class="lnk" id="back">Back to today</button></span>`:''}
    </div>`;
}

function dayPanel(k,tk,quietEditor=false){
  if(k!==tk) return snapshotPanel(k);
  const F=firstDone(), full=live().length>=MAXGOALS;
  const activeEditor=editing?(draftGoal||live().find(g=>g.id===editing)):null;
  return `
    ${live().length?live().map(g=>goalBlock(g,k,F)).join('')
      :'<p class="hint" style="padding:10px 0">No goals yet.</p>'}
    <div class="addrow">
      <button class="add addgoal" id="ag"><span aria-hidden="true">+</span> Goal</button>
      ${full?`<p class="cap">You already have ${MAXGOALS}. Remove one to add another.</p>`:''}
    </div>
    ${activeEditor?`<button class="editorbackdrop" data-cancel-edit aria-label="Cancel editing"></button>
      ${goalEditor(activeEditor,quietEditor)}`:''}`;
}

function snapshotPanel(k){
  const day=state.logs[k]||{};
  const goals=state.goals.filter(g=>g.subs.some(s=>day[s.id]));
  const rows=goals.map(g=>{
    const entries=g.subs.filter(s=>day[s.id]);
    const total=entries.reduce((n,s)=>n+day[s.id],0);
    return `<div class="goal snapshot">
      <div class="ghead"><h3>${esc(g.title)}${g.archived?'<i class="gone">archived</i>':''}</h3>
        <span class="prog"><b>${total}</b> record${total===1?'':'s'}</span></div>
      <div class="snapshotchips">${entries.map(s=>`<span class="snapshotchip">${esc(s.title)}${
        day[s.id]>1?`<b>×${day[s.id]}</b>`:''}</span>`).join('')}</div></div>`;
  }).join('');
  return `<div class="snapshotnote">Read-only snapshot</div>
    ${rows||'<p class="hint snapshotempty">No records for this day.</p>'}`;
}

function goalBlock(g,k,F){
  const ed=`<button class="lnk gedit" data-edit="${g.id}">Edit</button>`;
  const grip=`<button class="ghandle" data-grip="${g.id}"
    aria-label="Move ${esc(g.title)}" title="Drag to reorder, or use the arrow keys"></button>`;
  // a goal with no sub-goals still needs a way in, or it becomes unreachable
  const subs=liveSubs(g);   // archived sub-goals keep counting but are no longer tappable
  if(!subs.length) return `<div class="goal" data-goal="${g.id}">${grip}
    <div class="ghead"><h3>${esc(g.title)}</h3><div class="gright">${ed}</div></div>
    <p class="hint" style="margin-top:9px">${g.subs.length
      ? 'Every sub-goal here is archived. Edit to restore one or add another.'
      : 'No sub-goals yet. Edit to add one.'}</p></div>`;
  const {y,m}=view, day=state.logs[k]||{};
  let right='',prog='',pace='',chips='',done='';

  if(g.type==='count'){
    const target=g.target||40, c=goalCount(g,y,m);
    right=`<span class="prog mono">${c>=target?'<span class="hit">met</span> ':''}<b>${c}</b><i>/${target}</i> this month</span>`;
    prog='';
    pace=`<div class="pace">${paceLine(c,target)}</div>`;
    chips=subs.map(s=>{
      const c2=day[s.id]||0;
      const b=`<button class="chip ${c2?'on':''}" data-add="${s.id}">${esc(s.title)}${c2?`<span class="n mono">+${c2}</span>`:''}</button>`;
      return c2?`<span class="grp">${b}<button class="minus" data-minus="${s.id}">−</button></span>`:b;
    }).join('');
  }
  else if(g.type==='list'){
    const open=subs.filter(s=>!F[s.id]);
    // newest first: what this line is for is what you just crossed off, and it matches
    // the order the completion log in Stats already uses
    const fin=subs.filter(s=>F[s.id]).sort((a,b)=>F[a.id]<F[b.id]?1:-1);
    const thisM=fin.filter(s=>inMonth(F[s.id],y,m)).length;
    right=`<span class="prog mono">${thisM?`<b>+${thisM}</b> this month · `:''}<b>${fin.length}</b><i>/${subs.length}</i></span>`;
    prog=pips(fin.length,subs.length);
    chips=open.map(s=>`<button class="chip" data-add="${s.id}">${esc(s.title)}</button>`).join('');
    // A long list finishes far more than it has open, and the finished pile is the
    // least actionable thing on the screen — unfolded it pushed the next goal off the
    // bottom. Every one of them is still listed, dated, in Stats' completion log.
    const recent=fin.filter(s=>inLastMonth(F[s.id]));
    if(recent.length){
      const all=doneOpen.has(g.id), show=all?recent:recent.slice(0,DONEMAX), rest=recent.length-show.length;
      done=`<div class="doneline"><span class="lb">Done · last month</span>${
        show.map(s=>`<button class="undone" data-clear="${s.id}">${esc(s.title)}<em>${short(F[s.id])}</em></button>`).join('')}${
        rest>0?`<button class="lnk fold" data-more="${g.id}">+${rest} more</button>`:''}${
        all&&recent.length>DONEMAX?`<button class="lnk fold" data-more="${g.id}">Show fewer</button>`:''}</div>`;
    }
  }
  else{
    const d=goalDays(g,y,m);
    right=`<span class="prog mono"><b>${d}</b> day${d===1?'':'s'} this month</span>`;
    chips=subs.map(s=>`<button class="chip ${day[s.id]?'on':''}" data-tog="${s.id}">${esc(s.title)}</button>`).join('');
  }

  return `<div class="goal" data-goal="${g.id}">${grip}
    <div class="ghead"><h3>${esc(g.title)}</h3><div class="gright">${right}${ed}</div></div>
    ${prog}${pace}${chips?`<div class="chips">${chips}</div>`:''}${done}</div>`;
}

// The projection track is the app's thesis made visible: the dark segment is what
// is actually done, the light segment is where the current rate lands you by month
// end, and the grey remainder is the shortfall. Sentence below states the same in words.
function track(done,target,proj){
  const dp=Math.max(0,Math.min(100,done/target*100));
  const pp=Math.max(dp,Math.min(100,(proj===undefined?done:proj)/target*100));
  return `<div class="ptrack"><i class="done" style="width:${dp}%"></i>`
       + (pp>dp?`<i class="proj" style="left:${dp}%;width:${pp-dp}%"></i>`:'')
       + `</div>`;
}
// Pace is now shown only as the track: ink for what is done, accent for where this
// rate lands you, the well for the shortfall. The sentence that used to restate it in
// words was removed — including the one it opened with, which demanded a daily rate
// from a goal you had not started. The arithmetic stays, because it decides how far
// the projected segment reaches.
function paceLine(done,target){
  const n=today();
  const isCur = view.y===n.getFullYear()&&view.m===n.getMonth();
  // A month that is over cannot project, and a met target has nothing left to project to.
  if(!isCur || done>=target || done===0) return track(done,target);
  const el=n.getDate(), left=daysIn(view.y,view.m)-el;
  // Early in the month a rate measured over two or three days projects nonsense: three
  // done on the 1st would reach all the way across. Until ETAMIN days have elapsed the
  // track shows only what is actually done. §8.1
  if(el<ETAMIN) return track(done,target);
  const rate=done/el, days=Math.ceil((target-done)/rate);
  return days<=left ? track(done,target,target)             // this pace arrives in time
                    : track(done,target,Math.round(done+rate*left));
}

function pips(d,t){
  if(t>150) return `<div class="bar"><i style="width:${Math.min(100,d/t*100)}%"></i></div>`;
  let h=''; for(let i=0;i<t;i++) h+=`<div class="pip${i<d?' f':''}"></div>`;
  return `<div class="pips">${h}</div>`;
}

function achievements(){
  const out=[], F=firstDone();
  state.goals.forEach(g=>{
    if(g.type==='list')
      g.subs.forEach(s=>{ if(F[s.id]) out.push({d:F[s.id],g:g.title,gid:g.id,archived:g.archived,t:s.title}); });
    if(g.type==='count'){
      const acc={}, tg=g.target||40;
      Object.keys(state.logs).sort().forEach(k=>{
        let add=0; g.subs.forEach(s=>add+=state.logs[k][s.id]||0);
        if(!add) return;
        const mk=k.slice(0,7), before=acc[mk]||0;
        acc[mk]=before+add;
        if(before<tg && acc[mk]>=tg)
          out.push({d:k,g:g.title,gid:g.id,archived:g.archived,t:`${MONS[+mk.slice(5)-1]} target met · ${tg}`,hit:true});
      });
    }
  });
  return out.sort((a,b)=>a.d<b.d?1:-1);
}

// "How much have I done." An amount per goal, then the things actually finished.
// What was here before answered other questions — when in the week do I work, am I
// trending up — and neither of those is an amount. The per-goal figure is scoped to
// what the goal is: a count goal totals its check-ins, a list goal counts what is
// crossed off, and a daily goal counts days, because three of its sub-goals ticked on
// one day is still one day.
function goalAmount(g,y,m){
  const F=firstDone();
  const dated=s=>F[s.id]&&(y===undefined||inMonth(F[s.id],y,m));
  if(g.type==='list') return {v:g.subs.filter(dated).length, u:`of ${g.subs.length} done`};
  if(g.type==='daily'){
    const d=dayKeys().filter(k=>(y===undefined||inMonth(k,y,m))&&g.subs.some(s=>state.logs[k][s.id])).length;
    return {v:d, u:`day${d===1?'':'s'}`};
  }
  const c=g.subs.reduce((a,s)=>a+subTotal(s.id,y,m),0);
  return {v:c, u:`check-in${c===1?'':'s'}`};
}

function pageOf(items,key){
  const pages=Math.max(1,Math.ceil(items.length/PAGE_SIZE));
  sectionPage[key]=Math.max(0,Math.min(sectionPage[key],pages-1));
  const start=sectionPage[key]*PAGE_SIZE;
  return {items:items.slice(start,start+PAGE_SIZE),page:sectionPage[key],pages,total:items.length};
}
function pager(p,key){
  if(p.pages<=1)return '';
  return `<div class="pager"><button data-page="${key}" data-dir="-1" ${p.page===0?'disabled':''} aria-label="Previous page">‹</button>
    <span>${p.page+1} / ${p.pages}</span>
    <button data-page="${key}" data-dir="1" ${p.page===p.pages-1?'disabled':''} aria-label="Next page">›</button></div>`;
}
function foldTitle(key,title){
  return `<button class="sectiontoggle" data-section="${key}" aria-expanded="${sectionOpen[key]}">
    <span class="headingline"><h4>${title}</h4></span></button>`;
}

function statsPanel(){
  if(!state.goals.length) return `<div class="statsempty">
    <div class="emptychart" aria-hidden="true"><i></i><i></i><i></i></div>
    <h3>No stats yet</h3><p>No Goals to chart.</p>
    <button class="btn pri" id="emptyGoal">Create Goal</button></div>`;
  const ach=achievements().filter(a=>inMonth(a.d,view.y,view.m)&&!a.hit);
  const colors=['#176B57','#7B61A8','#3276A8','#C17A32','#B24C62'];
  const monthGoals=state.goals.filter(g=>!g.archived||goalAmount(g,view.y,view.m).v>0);
  const recordPage=pageOf(monthGoals,'records');
  const records=recordPage.items.map(g=>{
    const n=goalCount(g,view.y,view.m);
    return `<button class="recordrow" data-stat-goal="${g.id}" aria-label="${esc(g.title)} · ${n} record${n===1?'':'s'}">
      <div class="recordname"><b>${esc(g.title)}${g.archived?'<i class="gone">archived</i>':''}</b></div>
      <div class="recordvalue"><b>${n}</b><span>record${n===1?'':'s'}</span><i class="recordjump" aria-hidden="true">›</i></div></button>`;
  }).join('');
  const dayEntries=monthGoals.filter(g=>g.type==='daily').flatMap(g=>g.subs
    .filter(s=>!s.archived||subTotal(s.id,view.y,view.m)>0).map(s=>({g,s})));
  const dayPage=pageOf(dayEntries,'days');
  const activeDays=dayPage.items.map(({g,s})=>{
    const n=dayKeys().filter(k=>inMonth(k,view.y,view.m)&&(state.logs[k][s.id]||0)>0).length;
    const pct=Math.min(100,n/daysIn(view.y,view.m)*100);
    return `<div class="daybarrow" data-stat-target="${g.id}"><div class="recordname"><b>${esc(s.title)}${s.archived?'<i class="gone">archived</i>':''}</b>
      <span class="typebadge">${esc(g.title)}</span></div>
      <div class="recordvalue"><b>${n}</b><span>active day${n===1?'':'s'}</span></div>
      <span class="daybartrack" role="img" aria-label="${esc(s.title)} · ${n} active day${n===1?'':'s'}"><i style="width:${pct}%"></i></span></div>`;
  }).join('');
  const donutGoals=state.goals.filter(g=>g.type==='count'&&(!g.archived||goalAmount(g,view.y,view.m).v>0));
  const mixPage=pageOf(donutGoals,'mix');
  const donuts=mixPage.items.map(g=>{
    const active=liveSubs(g), values=active.map(s=>subTotal(s.id,view.y,view.m));
    const total=values.reduce((a,b)=>a+b,0);
    let at=0;
    const stops=values.map((n,i)=>{const from=at;at+=total?n/total*100:0;
      return `${colors[i%colors.length]} ${from}% ${at}%`}).join(',');
    const fill=total&&stops?`conic-gradient(${stops})`:'var(--sunk)';
    return `<section class="donutgroup${active.length>5?' wide':''}" data-stat-target="${g.id}">
      <div class="donut" role="img" aria-label="${esc(g.title)} monthly total ${total}" style="background:${fill}">
        <span><b>${total}</b><em>total</em></span></div>
      <div class="donutmeta"><h4><span>${esc(g.title)}</span>${g.archived?'<i class="gone">archived</i>':''}</h4>
        <div class="donutlegend">${active.map((s,i)=>`<span><i style="background:${colors[i%colors.length]}"></i>
          <em>${esc(s.title)}</em><b>${values[i]}</b></span>`).join('')}</div></div>
    </section>`;
  }).join('');
  const completedPage=pageOf(ach,'completed');

  return `
    <section class="recordsummary">
      <div class="charthead${sectionOpen.records?'':' closed'}"><div>${foldTitle('records','Monthly records')}</div></div>
      ${sectionOpen.records?`<div class="recordlist">${records}</div>${pager(recordPage,'records')}`:''}
    </section>
    ${dayEntries.length?`<section class="chartcard"><div class="charthead${sectionOpen.days?'':' closed'}"><div>${foldTitle('days','Active days')}</div></div>
      ${sectionOpen.days?`<div class="daybarlist">${activeDays}</div>${pager(dayPage,'days')}`:''}</section>`:''}
    ${donutGoals.length?`<section class="chartcard"><div class="charthead${sectionOpen.mix?'':' closed'}"><div>${foldTitle('mix','Category mix')}</div>
      </div>${sectionOpen.mix?`<div class="donutgrid">${donuts}</div>${pager(mixPage,'mix')}`:''}</section>`:''}

    ${ach.length?`<section class="chartcard"><div class="charthead${sectionOpen.completed?'':' closed'}"><div>${foldTitle('completed','Completed')}</div>
      <span class="sectioncount">${ach.length} item${ach.length===1?'':'s'} this month</span></div>
    ${sectionOpen.completed?`<div class="ach">${completedPage.items.map(a=>
      `<div class="arow${a.hit?' hit':''}" data-stat-target="${a.gid}">
        <span class="ad mono">${short(a.d)}</span>
        <span class="completedname"><span class="at">${esc(a.t)}</span>
          <span class="typebadge">${esc(a.g)}${a.archived?'<i class="gone">archived</i>':''}</span></span></div>`).join('')
      }</div>${pager(completedPage,'completed')}`:''}</section>`:''}`;
}

/* ---------- events ---------- */
const on=(q,f)=>document.querySelectorAll(q).forEach(f);
function refreshEditor(focusId=null){
  const current=document.querySelector('.goal.ed'), scroll=current?current.scrollTop:0;
  render(true);
  const drawer=document.querySelector('.goal.ed'); if(drawer) drawer.scrollTop=scroll;
  if(focusId){
    const input=document.querySelector(`[data-st="${focusId}"]`);
    if(input){input.focus();input.select();}
  }
}
function beginEdit(id){
  const source=state.goals.find(g=>g.id===id); if(!source)return;
  draftGoal=JSON.parse(JSON.stringify(source)); draftIsNew=false; editing=id; render();
}
function cancelEdit(){
  editing=null; draftGoal=null; draftIsNew=false; render();
}
function commitEdit(){
  if(!draftGoal)return cancelEdit();
  draftGoal.subs=draftGoal.subs.filter(s=>s.title.trim());
  if(draftIsNew) state.goals.push(draftGoal);
  else{
    const i=state.goals.findIndex(g=>g.id===draftGoal.id);
    if(i>=0) state.goals[i]=draftGoal;
  }
  editing=null; draftGoal=null; draftIsNew=false; save(); render();
}
function createGoal(){
  if(live().length>=MAXGOALS) return;
  const id=newId();
  draftGoal={id,type:'daily',title:'New goal',subs:[]};
  draftIsNew=true; editing=id; panel='day'; render();
}
function navigateGoal(id){
  const g=state.goals.find(g=>g.id===id);if(!g)return;
  if(g.archived){panel='archive';archiveOpen.add(id);render();
    setTimeout(()=>document.querySelector(`[data-archive-goal="${id}"]`)
      ?.scrollIntoView({behavior:'smooth',block:'center'}),0);return;}
  const monthGoals=state.goals.filter(g=>!g.archived||goalAmount(g,view.y,view.m).v>0);
  const key=g.type==='daily'?'days':g.type==='count'?'mix':'completed';
  const items=key==='days'?monthGoals.filter(g=>g.type==='daily').flatMap(g=>g.subs
    .filter(s=>!s.archived||subTotal(s.id,view.y,view.m)>0).map(s=>({g,s}))):
    key==='mix'?state.goals.filter(g=>g.type==='count'&&(!g.archived||goalAmount(g,view.y,view.m).v>0)):
    achievements().filter(a=>inMonth(a.d,view.y,view.m)&&!a.hit);
  const index=key==='completed'?items.findIndex(a=>a.gid===id):
    key==='days'?items.findIndex(x=>x.g.id===id):items.findIndex(g=>g.id===id);
  if(index<0)return;
  sectionOpen[key]=true;sectionPage[key]=Math.floor(index/PAGE_SIZE);render();
  setTimeout(()=>document.querySelector(`[data-stat-target="${id}"]`)
    ?.scrollIntoView({behavior:'smooth',block:'center'}),0);
}
function bind(){
  on('[data-tog]',b=>b.onclick=()=>{const k=sel||todayKey();
    bump(b.dataset.tog,(state.logs[k]||{})[b.dataset.tog]?-1:1);});
  on('[data-add]',b=>b.onclick=()=>bump(b.dataset.add,1));
  on('[data-minus]',b=>b.onclick=()=>bump(b.dataset.minus,-1));
  on('[data-clear]',b=>b.onclick=()=>clearSub(b.dataset.clear));
  on('[data-more]',b=>b.onclick=()=>{ const id=b.dataset.more;
    doneOpen.has(id)?doneOpen.delete(id):doneOpen.add(id); render(); });
  on('[data-ao]',b=>b.onclick=()=>{ const id=b.dataset.ao;
    archiveOpen.has(id)?archiveOpen.delete(id):archiveOpen.add(id); render(); });
  on('[data-sm]',b=>b.onclick=()=>{sectionPage.records=sectionPage.days=sectionPage.mix=sectionPage.completed=0;shift(+b.dataset.sm);});
  on('[data-section]',b=>b.onclick=()=>{const k=b.dataset.section;sectionOpen[k]=!sectionOpen[k];render();});
  on('[data-page]',b=>b.onclick=()=>{if(b.disabled)return;sectionPage[b.dataset.page]+=+b.dataset.dir;render();});
  on('[data-stat-goal]',b=>b.onclick=()=>navigateGoal(b.dataset.statGoal));
  on('.d[data-k]',c=>c.onclick=()=>{ sel=c.dataset.k; panel='day'; render(); });
  on('.hd[data-hk]',c=>c.onclick=()=>{ const d=parseKey(c.dataset.hk);
    view={y:d.getFullYear(),m:d.getMonth()}; sel=c.dataset.hk; panel='day'; render(); });

  document.getElementById('prev').onclick=()=>shift(-1);
  const nx=document.getElementById('next'); if(nx&&!nx.disabled) nx.onclick=()=>shift(1);
  const bk=document.getElementById('back');
  if(bk) bk.onclick=()=>{const n=today();view={y:n.getFullYear(),m:n.getMonth()};sel=todayKey();panel='day';render();};
  const recordsJump=document.getElementById('recordsJump');
  if(recordsJump) recordsJump.onclick=()=>document.querySelector('.history')?.scrollIntoView({behavior:'smooth',block:'start'});
  on('[data-tab]',b=>b.onclick=()=>{
    const p=b.dataset.tab;
    // no day is selected while browsing another month, so the day view returns to today
    if(p==='day'&&!sel){ const n=today(); view={y:n.getFullYear(),m:n.getMonth()}; sel=todayKey(); }
    if(p!=='day'){editing=null;draftGoal=null;draftIsNew=false;}
    panel=p; render();});
  on('[data-edit]',b=>b.onclick=()=>beginEdit(b.dataset.edit));
  on('[data-cancel-edit]',b=>b.onclick=cancelEdit);
  on('[data-save-edit]',b=>b.onclick=commitEdit);

  // Reordering, on plain mouse events rather than HTML5 drag and drop. The native API
  // needs `draggable` set before the gesture begins, and setting it from the handle's
  // mousedown was already too late in the app's own webview — the drag never started.
  // Mouse events have no engine-specific machinery to get wrong, and no library (§2.2).
  on('[data-grip]',h=>{
    h.onmousedown=e=>{ e.preventDefault(); beginDrag(h.dataset.grip); };   // no text selection
    h.onkeydown=e=>{ const d=e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0;
      if(d){ e.preventDefault(); nudgeGoal(h.dataset.grip,d); } };
  });

  const ag=document.getElementById('ag');
  if(ag) ag.onclick=createGoal;
  const emptyGoal=document.getElementById('emptyGoal'); if(emptyGoal) emptyGoal.onclick=createGoal;
  on('[data-as]',b=>b.onclick=()=>{
    const id=newId();
    if(draftGoal&&draftGoal.id===b.dataset.as){draftGoal.subs.push({id,title:''});refreshEditor(id);}
  });
  on('[data-gt]',i=>i.oninput=()=>{if(draftGoal&&draftGoal.id===i.dataset.gt)draftGoal.title=i.value;});
  on('[data-gy]',b=>b.onclick=()=>{const g=draftGoal;
    if(!g||g.id!==b.dataset.gy)return; g.type=b.dataset.type; if(g.type==='count'&&!g.target)g.target=40; refreshEditor();});
  on('[data-gn]',i=>i.oninput=()=>{
    if(draftGoal&&draftGoal.id===i.dataset.gn)draftGoal.target=Math.max(1,+i.value||1);});
  on('[data-st]',i=>i.oninput=()=>{
    if(!draftGoal)return;const s=draftGoal.subs.find(s=>s.id===i.dataset.st);if(s)s.title=i.value;});
  on('[data-dg]',b=>b.onclick=()=>{if(draftIsNew)cancelEdit();else dropGoal(b.dataset.dg);});
  on('[data-ds]',b=>b.onclick=()=>{if(!draftGoal)return;const i=draftGoal.subs.findIndex(s=>s.id===b.dataset.ds);
    if(i<0)return;subLogged(b.dataset.ds)?draftGoal.subs[i].archived=true:draftGoal.subs.splice(i,1);refreshEditor();});
  on('[data-rs]',b=>b.onclick=()=>{if(!draftGoal)return;const s=draftGoal.subs.find(s=>s.id===b.dataset.rs);
    if(s){delete s.archived;refreshEditor();}});
  on('[data-rg]',b=>b.onclick=()=>restoreGoal(b.dataset.rg));
  on('[data-pg]',b=>b.onclick=()=>{purging=b.dataset.pg; notice=''; render();});
  on('[data-purge]',b=>b.onclick=()=>purgeGoal(b.dataset.purge));
  const np=document.getElementById('nopurge');
  if(np) np.onclick=()=>{purging=null; render();};
}

function shift(d){
  let m=view.m+d, y=view.y;
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  view={y,m};
  const n=today(), cur=y===n.getFullYear()&&m===n.getMonth();
  if(panel!=='stats') panel='day';
  sel=cur?todayKey():null;
  render();
}

load();
</script>
